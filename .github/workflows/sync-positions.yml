name: Sync positions

# Tõmbab PORTFELL_positions.csv Google Drive'ist (fail peab olema jagatud "Anyone with the link")
# ja paneb selle reposse, kui sisu muutus. PORTFELL sünkroon Drive'i jookseb iga tund.
on:
  schedule:
    - cron: "20 * * * *"    # iga tund, :20 minutil
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/sync-positions.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      FILE_ID: 1878rAg0Gh2laz741K1r8tKou_22EztMx
    steps:
      - uses: actions/checkout@v4
      - name: Download CSV from Drive
        run: |
          set -euo pipefail
          curl -fsSL -o new.csv "https://drive.usercontent.google.com/download?id=${FILE_ID}&export=download&confirm=t"
          head -c 200 new.csv; echo
          if ! head -n1 new.csv | grep -q '^Book,Symbol,'; then
            echo "::error::Drive ei andnud CSV-faili. Kontrolli, et PORTFELL_positions.csv on jagatud 'Anyone with the link'."
            exit 1
          fi
          lines=$(wc -l < new.csv)
          if [ "$lines" -lt 20 ]; then echo "::error::CSV on kahtlaselt lühike ($lines rida)"; exit 1; fi
      - name: Commit if changed
        run: |
          set -euo pipefail
          if [ -f positions.csv ] && cmp -s new.csv positions.csv; then
            echo "Muutusi pole"; rm new.csv; exit 0
          fi
          mv new.csv positions.csv
          printf '{"fetchedAt":"%s"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > meta.json
          git config user.name "positions-sync"
          git config user.email "actions@users.noreply.github.com"
          git add positions.csv meta.json
          git commit -m "Positsioonid $(date -u +%Y-%m-%d)"
          git push
